[project]
name = "yams-rl"
version = "0.1.0"
description = "RL agent to play Yams"
readme = "README.md"
authors = [
    { name = "Martin Quilichini", email = "martin.quilichini2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "tyro>=1.0.17",
]

[project.scripts]
yams-rl = "yams_rl:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
